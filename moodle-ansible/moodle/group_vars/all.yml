---
# Site
moodle_domain: "dev.moodle.lmsconsultant.shop"
moodle_url: "http://dev.moodle.lmsconsultant.shop"

# Moodle code
moodle_repo: "https://github.com/moodle/moodle.git"
moodle_branch: "MOODLE_500_STABLE"
moodle_dir: "/var/www/html/moodle"
moodle_data: "/var/moodledata"
web_user: "apache"               # php-fpm runs as apache on RHEL

# PHP (RHEL 9 AppStream module stream)
php_stream: "8.3"

# MySQL 8.4 LTS (Oracle's RHEL 9 repo package - the RHEL equivalent of mysql-apt-config)
mysql_repo_rpm: "mysql84-community-release-el9-4.noarch.rpm"
mysql_repo_url: "https://dev.mysql.com/get/mysql84-community-release-el9-4.noarch.rpm"
mysql_root_password: "Root@12345"   # CHANGE THIS - saved to /root/.my.cnf
db_name: "moodle"
db_user: "moodleuser"
db_password: "moodle@123"        # encrypt with ansible-vault for anything beyond dev
db_host: "127.0.0.1"             # MySQL runs on the same server

# Moodle site install (CLI). Set moodle_auto_install: false to finish in the browser instead.
moodle_auto_install: true
moodle_site_fullname: "LMS Consultant Moodle"
moodle_site_shortname: "lmsdev"
moodle_admin_user: "admin"
moodle_admin_pass: "Admin@12345"                 # CHANGE THIS
moodle_admin_email: "admin@lmsconsultant.shop"   # CHANGE THIS
