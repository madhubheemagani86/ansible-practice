---
# Moodle 5.0 on a single RHEL 9 server (Redhat-9-DevOps-Practice AMI)
#   nginx + PHP 8.3 (php-fpm) + MySQL 8.4 LTS + Moodle 5.0
#   Site: http://dev.moodle.lmsconsultant.shop
#
# Layout:
#   ansible.cfg
#   inventory.ini
#   group_vars/all.yml      <- all settings
#   moodle-playbook.yml
#
# Control node:
#   sshpass (password login), plus: ansible-galaxy collection install community.mysql
# Run (from this folder):
#   ansible-playbook moodle-playbook.yml

- name: Moodle 5.0 on nginx + PHP 8.3 + MySQL 8.4 (RHEL 9)
  hosts: moodle
  become: true

  vars:
    mysql_socket: /var/lib/mysql/mysql.sock
    php_fpm_socket: /run/php-fpm/www.sock
    php_packages:            # from the php:8.3 AppStream module
      - php-fpm
      - php-cli
      - php-common
      - php-mysqlnd
      - php-pdo
      - php-gd
      - php-intl
      - php-mbstring
      - php-xml
      - php-pecl-zip
      - php-soap
      - php-sodium
      - php-bcmath
      - php-opcache
      - php-process
      - php-ldap

  tasks:
    # ----------------------------------------------------------------------
    # Pre-checks
    # ----------------------------------------------------------------------
    - name: Confirm the OS is RHEL 9 family
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
          - ansible_facts['distribution'] != 'Amazon'
          - ansible_facts['distribution_major_version'] == '9'
        fail_msg: >-
          This playbook needs RHEL 9 (or Rocky/Alma/CentOS Stream 9). Found
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}

    - name: Remember whether SELinux is enforcing/permissive
      ansible.builtin.set_fact:
        selinux_on: "{{ ansible_facts['selinux']['status'] | default('disabled') == 'enabled' }}"

    - name: Install base packages
      ansible.builtin.dnf:
        name: [wget, file, git, unzip, tar, cronie, python3-pip, policycoreutils-python-utils]
        state: present

    - name: Install PyMySQL (needed by the community.mysql modules)
      ansible.builtin.pip:
        name: PyMySQL
        executable: pip3

    - name: Gather service states (to see whether firewalld is running)
      ansible.builtin.service_facts:

    # ----------------------------------------------------------------------
    # MySQL 8.4 LTS (RHEL equivalent of the mysql-apt-config steps)
    # ----------------------------------------------------------------------
    - name: Disable RHEL's own MySQL module so the 8.4 community packages are used
      ansible.builtin.shell: |
        set -o pipefail
        if dnf -q module list --disabled mysql 2>/dev/null | grep -q '^mysql'; then exit 0; fi
        dnf -y module disable mysql && echo changed
      args:
        executable: /bin/bash
      register: mysql_module
      changed_when: "'changed' in mysql_module.stdout"

    - name: Download the MySQL 8.4 repo package
      block:
        # dev.mysql.com answers 403 to Ansible's default (Python) user agent,
        # so use repo.mysql.com and a wget user agent.
        - name: Download from repo.mysql.com
          ansible.builtin.get_url:
            url: "{{ mysql_repo_url }}"
            dest: "/tmp/{{ mysql_repo_rpm }}"
            mode: "0644"
            http_agent: "Wget/1.21.1"
      rescue:
        - name: Fallback - download from dev.mysql.com with wget
          ansible.builtin.command: wget -q -O /tmp/{{ mysql_repo_rpm }} {{ mysql_repo_url_fallback }}  # noqa: command-instead-of-module
          args:
            creates: "/tmp/{{ mysql_repo_rpm }}"

    - name: Verify it is a real RPM (not an HTML error page)
      ansible.builtin.command: file /tmp/{{ mysql_repo_rpm }}
      register: rpm_type
      changed_when: false
      failed_when: "'RPM' not in rpm_type.stdout"

    - name: Download MySQL GPG key
      ansible.builtin.get_url:
        url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
        dest: /tmp/RPM-GPG-KEY-mysql-2023
        mode: "0644"
        http_agent: "Wget/1.21.1"

    - name: Import MySQL GPG key
      ansible.builtin.rpm_key:
        key: /tmp/RPM-GPG-KEY-mysql-2023
        state: present

    - name: Install the MySQL repo package
      ansible.builtin.dnf:
        name: "/tmp/{{ mysql_repo_rpm }}"
        state: present

    - name: Check which MySQL server version dnf will install
      ansible.builtin.command: dnf -q info --available mysql-community-server
      register: mysql_available
      changed_when: false
      failed_when: "'8.4.' not in mysql_available.stdout"

    - name: Install MySQL server and client 8.4
      ansible.builtin.dnf:
        name: [mysql-community-server, mysql-community-client]
        state: present

    - name: MySQL settings for Moodle (utf8mb4, local only)
      ansible.builtin.blockinfile:
        path: /etc/my.cnf
        insertafter: '^\[mysqld\]'
        marker: "# {mark} ANSIBLE MANAGED - moodle"
        block: |
          bind-address           = 127.0.0.1
          character-set-server   = utf8mb4
          collation-server       = utf8mb4_unicode_ci
          innodb_file_per_table  = 1
          max_allowed_packet     = 64M
          # Allow "moodle@123" if the password-validation component is present
          loose-validate_password.policy = LOW
      notify: Restart mysqld

    - name: Initialise data directory without a temporary root password (first run only)
      ansible.builtin.command: mysqld --initialize-insecure --user=mysql
      args:
        creates: /var/lib/mysql/mysql.ibd

    - name: Fix SELinux labels on the new MySQL data directory
      ansible.builtin.command: restorecon -R /var/lib/mysql
      register: mysql_restorecon
      changed_when: mysql_restorecon.stdout | length > 0
      when: selinux_on

    - name: Start and enable MySQL
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: true

    - name: Apply MySQL config now
      ansible.builtin.meta: flush_handlers

    - name: Assert MySQL 8.4 is running
      ansible.builtin.command: mysql --version
      register: mysql_version
      changed_when: false
      failed_when: "' 8.4.' not in mysql_version.stdout"

    - name: Set MySQL root password (works on first run and re-runs)
      community.mysql.mysql_user:  # noqa: fqcn[canonical]
        name: root
        host: localhost
        password: "{{ mysql_root_password }}"
        check_implicit_admin: true
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"
      no_log: true

    - name: Save root credentials for local admin use
      ansible.builtin.copy:
        dest: /root/.my.cnf
        mode: "0600"
        content: |
          [client]
          user=root
          password={{ mysql_root_password }}
          socket={{ mysql_socket }}
      no_log: true

    - name: Create database "moodle"
      community.mysql.mysql_db:  # noqa: fqcn[canonical]
        name: "{{ db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"

    - name: Create moodleuser with full read/write on the moodle database
      community.mysql.mysql_user:  # noqa: fqcn[canonical]
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        host: "{{ item }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"
      loop: [localhost, 127.0.0.1]
      no_log: true

    # ----------------------------------------------------------------------
    # PHP 8.3 (php-fpm)
    # ----------------------------------------------------------------------
    - name: Switch the PHP module stream to 8.3
      ansible.builtin.shell: |
        set -o pipefail
        if dnf -q module list --enabled php 2>/dev/null | grep -Eq '^php +{{ php_stream }}'; then exit 0; fi
        dnf -y module reset php && dnf -y module enable php:{{ php_stream }} && echo changed
      args:
        executable: /bin/bash
      register: php_module
      changed_when: "'changed' in php_module.stdout"

    - name: Install PHP 8.3 and extensions
      ansible.builtin.dnf:
        name: "{{ php_packages }}"
        state: present

    - name: Assert PHP is 8.3
      ansible.builtin.command: php -r 'echo PHP_VERSION;'
      register: php_version
      changed_when: false
      failed_when: not php_version.stdout.startswith(php_stream)

    - name: Moodle PHP settings (shared by php-fpm and CLI)
      ansible.builtin.copy:
        dest: /etc/php.d/99-moodle.ini
        mode: "0644"
        content: |
          max_input_vars = 5000
          memory_limit = 512M
          upload_max_filesize = 200M
          post_max_size = 200M
          max_execution_time = 300
          opcache.enable = 1
          opcache.memory_consumption = 256
          opcache.max_accelerated_files = 20000
      notify: Restart php-fpm

    - name: Verify required PHP extensions are loaded
      ansible.builtin.shell: |
        set -o pipefail
        missing=""
        for ext in iconv mbstring curl openssl ctype zip zlib gd simplexml spl pcre dom xml xmlreader intl json hash fileinfo sodium mysqli; do
          php -m | grep -qix "$ext" || missing="$missing $ext"
        done
        [ -z "$missing" ] || { echo "Missing:$missing"; exit 1; }
      args:
        executable: /bin/bash
      changed_when: false

    - name: Start and enable php-fpm
      ansible.builtin.service:
        name: php-fpm
        state: started
        enabled: true

    # ----------------------------------------------------------------------
    # nginx
    # ----------------------------------------------------------------------
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Moodle nginx site
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/moodle.conf
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name {{ moodle_domain }} {{ ansible_host }};

              root {{ moodle_dir }};
              index index.php;
              client_max_body_size 200M;

              # Hide internal files Moodle should never serve
              location ~ /\. { deny all; return 404; }
              location ~ (/vendor/|/node_modules/|composer\.(json|lock)|/fixtures/|/behat/|phpunit\.xml) {
                  deny all;
                  return 404;
              }
              location ~ (/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|/db/install\.xml|environment\.xml) {
                  deny all;
                  return 404;
              }

              # Moodle router: unknown paths go to r.php
              location / {
                  try_files $uri $uri/ /r.php;
              }

              # PHP with slash arguments (e.g. /pluginfile.php/1/...)
              location ~ [^/]\.php(/|$) {
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_index           index.php;
                  fastcgi_pass            unix:{{ php_fpm_socket }};
                  include                 fastcgi_params;
                  fastcgi_param           PATH_INFO       $fastcgi_path_info;
                  fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_read_timeout    300;
              }

              access_log /var/log/nginx/moodle_access.log;
              error_log  /var/log/nginx/moodle_error.log;
          }
      notify: Reload nginx

    - name: Validate nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Start and enable nginx and crond
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [nginx, crond]

    - name: Open HTTP in firewalld
      ansible.builtin.shell: |
        firewall-cmd --query-service=http --permanent >/dev/null && exit 0
        firewall-cmd --add-service=http --permanent && firewall-cmd --reload && echo changed
      args:
        executable: /bin/bash
      register: fw_web
      changed_when: "'changed' in fw_web.stdout"
      when: ansible_facts['services']['firewalld.service']['state'] | default('') == 'running'

    # ----------------------------------------------------------------------
    # Moodle 5.0 code
    # ----------------------------------------------------------------------
    - name: Mark Moodle directory as a safe git directory (repo is owned by apache)
      ansible.builtin.blockinfile:
        path: /etc/gitconfig
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED - moodle safe.directory"
        block: |
          [safe]
              directory = {{ moodle_dir }}

    - name: Clone Moodle 5.0 (MOODLE_500_STABLE) into /var/www/html/moodle
      ansible.builtin.git:
        repo: "{{ moodle_repo }}"
        dest: "{{ moodle_dir }}"
        version: "{{ moodle_branch }}"
        depth: 1
        update: false          # don't pull new commits on re-runs; upgrade deliberately
      register: moodle_clone

    - name: Set ownership of Moodle code
      ansible.builtin.file:
        path: "{{ moodle_dir }}"
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        recurse: true
      when: moodle_clone.changed  # noqa: no-handler

    - name: Create moodledata directory
      ansible.builtin.file:
        path: "{{ moodle_data }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        mode: "0770"

    - name: Write Moodle config.php
      ansible.builtin.copy:
        dest: "{{ moodle_dir }}/config.php"
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        mode: "0640"
        content: |
          <?php
          unset($CFG);
          global $CFG;
          $CFG = new stdClass();

          $CFG->dbtype    = 'mysqli';
          $CFG->dblibrary = 'native';
          $CFG->dbhost    = '{{ db_host }}';
          $CFG->dbname    = '{{ db_name }}';
          $CFG->dbuser    = '{{ db_user }}';
          $CFG->dbpass    = '{{ db_password }}';
          $CFG->prefix    = 'mdl_';
          $CFG->dboptions = [
              'dbpersist'   => 0,
              'dbport'      => 3306,
              'dbsocket'    => '',
              'dbcollation' => 'utf8mb4_unicode_ci',
          ];

          $CFG->wwwroot   = '{{ moodle_url }}';
          $CFG->dataroot  = '{{ moodle_data }}';
          $CFG->admin     = 'admin';
          $CFG->directorypermissions = 02777;

          // nginx sends unknown paths to /r.php, so clean router URLs work.
          $CFG->routerconfigured = true;

          require_once(__DIR__ . '/lib/setup.php');

    # ----------------------------------------------------------------------
    # SELinux (enforcing by default on RHEL 9)
    # ----------------------------------------------------------------------
    - name: SELinux - let php-fpm write to moodledata
      ansible.builtin.shell: |
        set -o pipefail
        semanage fcontext -l | grep -q '^{{ moodle_data }}(/.\*)?' && exit 0
        semanage fcontext -a -t httpd_sys_rw_content_t '{{ moodle_data }}(/.*)?' && echo changed
      args:
        executable: /bin/bash
      register: se_data
      changed_when: "'changed' in se_data.stdout"
      when: selinux_on

    - name: SELinux - apply labels to Moodle code and moodledata
      ansible.builtin.command: restorecon -R {{ moodle_dir }} {{ moodle_data }}
      register: se_restore
      changed_when: se_restore.stdout | length > 0
      when: selinux_on

    - name: SELinux - allow php-fpm to reach MySQL and the network
      ansible.builtin.shell: |
        set -o pipefail
        changed=""
        for b in httpd_can_network_connect_db httpd_can_network_connect; do
          getsebool "$b" | grep -q ' on$' || { setsebool -P "$b" on; changed=yes; }
        done
        [ -n "$changed" ] && echo changed || true
      args:
        executable: /bin/bash
      register: se_bool
      changed_when: "'changed' in se_bool.stdout"
      when: selinux_on

    # ----------------------------------------------------------------------
    # Install + cron + smoke test
    # ----------------------------------------------------------------------
    - name: Apply PHP and nginx changes now
      ansible.builtin.meta: flush_handlers

    - name: Check whether Moodle is already installed
      ansible.builtin.command: runuser -u {{ web_user }} -- php {{ moodle_dir }}/admin/cli/cfg.php --name=release
      register: moodle_installed
      changed_when: false
      failed_when: false
      when: moodle_auto_install | bool

    - name: Install Moodle database (CLI, first run only)
      ansible.builtin.command: >
        runuser -u {{ web_user }} --
        php {{ moodle_dir }}/admin/cli/install_database.php
        --agree-license
        --fullname="{{ moodle_site_fullname }}"
        --shortname="{{ moodle_site_shortname }}"
        --adminuser="{{ moodle_admin_user }}"
        --adminpass="{{ moodle_admin_pass }}"
        --adminemail="{{ moodle_admin_email }}"
      register: moodle_install
      changed_when: moodle_install.rc == 0
      when:
        - moodle_auto_install | bool
        - moodle_installed.rc != 0 or moodle_installed.stdout | length == 0
      no_log: true

    - name: Moodle cron every minute
      ansible.builtin.cron:
        name: moodle-cron
        user: "{{ web_user }}"
        job: "/usr/bin/php {{ moodle_dir }}/admin/cli/cron.php > /dev/null 2>&1"

    - name: Smoke test the site over HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        headers:
          Host: "{{ moodle_domain }}"
        status_code: [200, 303]
        follow_redirects: none
      changed_when: false

  handlers:
    - name: Restart mysqld
      ansible.builtin.service:
        name: mysqld
        state: restarted

    - name: Restart php-fpm
      ansible.builtin.service:
        name: php-fpm
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
