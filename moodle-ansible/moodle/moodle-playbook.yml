---
# Moodle 5.3 on Amazon Linux 2023 or RHEL 9 family (RHEL / Rocky / Alma / CentOS Stream 9)
#   DB  : MySQL 8.4 LTS  -> 54.160.140.250 (private 172.31.18.233)
#   WEB : httpd + php-fpm 8.3 + Moodle 5.3 -> 107.22.85.229 (dev.moodle.lmsconsultant.shop)
#
# Layout:
#   ansible.cfg
#   inventory.ini
#   group_vars/all.yml      <- all settings (URL, repo, DB credentials, admin login)
#   moodle-playbook.yml
#
# Control node:
#   sshpass (password login), plus: ansible-galaxy collection install community.mysql
# Run (from this folder):
#   ansible-playbook moodle-playbook.yml

# ---------------------------------------------------------------------------
# COMMON: OS detection, SELinux tools, firewalld
# ---------------------------------------------------------------------------
- name: Common preparation
  hosts: moodle
  become: true

  tasks:
    - name: Work out which supported OS this is
      ansible.builtin.set_fact:
        is_amazon: "{{ ansible_facts['distribution'] == 'Amazon' and ansible_facts['distribution_major_version'] == '2023' }}"
        is_el9: "{{ ansible_facts['distribution'] != 'Amazon' and ansible_facts['os_family'] == 'RedHat'
                    and ansible_facts['distribution_major_version'] == '9' }}"
        selinux_on: "{{ ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
                        and ansible_facts['selinux']['mode'] | default('') != 'disabled' }}"

    - name: Stop on unsupported OS
      ansible.builtin.assert:
        that: is_amazon or is_el9
        fail_msg: >-
          Supported: Amazon Linux 2023 or RHEL 9 family. Found
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}

    - name: Show detected OS
      ansible.builtin.debug:
        msg: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}, SELinux {{ 'on' if selinux_on else 'off' }}"

    - name: Install SELinux management tools
      ansible.builtin.dnf:
        name: [policycoreutils-python-utils]
        state: present
      when: selinux_on

    - name: Gather service states (to see whether firewalld is running)
      ansible.builtin.service_facts:

    - name: Remember firewalld state
      ansible.builtin.set_fact:
        firewalld_on: "{{ ansible_facts['services']['firewalld.service']['state'] | default('') == 'running' }}"

# ---------------------------------------------------------------------------
# DATABASE SERVER
# ---------------------------------------------------------------------------
- name: Install and configure MySQL 8.4
  hosts: db
  become: true

  vars:
    mysql_socket: /var/lib/mysql/mysql.sock

  tasks:
    - name: Install pip
      ansible.builtin.dnf:
        name: [python3-pip]
        state: present

    - name: Install PyMySQL (needed by the community.mysql modules)
      ansible.builtin.pip:
        name: PyMySQL
        executable: pip3

    - name: Disable the distro MySQL module so MySQL 8.4 community packages are used (RHEL 9)
      ansible.builtin.shell: |
        set -o pipefail
        if dnf -q module list --disabled mysql 2>/dev/null | grep -q '^mysql'; then exit 0; fi
        dnf -y module disable mysql && echo changed
      args:
        executable: /bin/bash
      register: mysql_module
      changed_when: "'changed' in mysql_module.stdout"
      when: is_el9

    - name: Import MySQL GPG key
      ansible.builtin.rpm_key:
        key: https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
        state: present

    - name: Add MySQL 8.4 LTS repository (el9 build)
      ansible.builtin.dnf:
        name: https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm
        state: present

    - name: Install MySQL server 8.4
      ansible.builtin.dnf:
        name: mysql-community-server
        state: present

    - name: Configure MySQL for Moodle (listen on private IP only, utf8mb4)
      ansible.builtin.blockinfile:
        path: /etc/my.cnf
        insertafter: '^\[mysqld\]'
        marker: "# {mark} ANSIBLE MANAGED - moodle"
        block: |
          bind-address           = {{ mysql_private_ip }}
          character-set-server   = utf8mb4
          collation-server       = utf8mb4_unicode_ci
          innodb_file_per_table  = 1
          max_allowed_packet     = 64M
          # Allow "moodle@123" if the password-validation component is present
          loose-validate_password.policy = LOW
      notify: Restart mysqld

    - name: Initialise data directory without a temporary root password (first run only)
      ansible.builtin.command: mysqld --initialize-insecure --user=mysql
      args:
        creates: /var/lib/mysql/mysql.ibd

    - name: Fix SELinux labels on the new data directory
      ansible.builtin.command: restorecon -R /var/lib/mysql
      register: mysql_restorecon
      changed_when: mysql_restorecon.stdout | length > 0
      when: selinux_on

    - name: Start and enable MySQL
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: true

    - name: Open port 3306 in firewalld
      ansible.builtin.shell: |
        firewall-cmd --query-port=3306/tcp --permanent >/dev/null && exit 0
        firewall-cmd --add-port=3306/tcp --permanent && firewall-cmd --reload && echo changed
      args:
        executable: /bin/bash
      register: fw_db
      changed_when: "'changed' in fw_db.stdout"
      when: firewalld_on

    - name: Apply config changes now (bind-address must be live before the web tier connects)
      ansible.builtin.meta: flush_handlers

    - name: Read MySQL server version
      ansible.builtin.command: mysql --version
      register: mysql_version
      changed_when: false

    - name: Assert MySQL is 8.4 (Moodle 5.3 minimum)
      ansible.builtin.assert:
        that: "' 8.4.' in mysql_version.stdout"
        fail_msg: "Expected MySQL 8.4, got: {{ mysql_version.stdout }}"

    - name: Set MySQL root password (works on first run and re-runs)
      community.mysql.mysql_user:  # noqa: fqcn[canonical]
        name: root
        host: localhost
        password: "{{ mysql_root_password }}"
        check_implicit_admin: true
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"
      no_log: true

    - name: Save root credentials for local admin use
      ansible.builtin.copy:
        dest: /root/.my.cnf
        mode: "0600"
        content: |
          [client]
          user=root
          password={{ mysql_root_password }}
          socket={{ mysql_socket }}
      no_log: true

    - name: Create database "moodle"
      community.mysql.mysql_db:  # noqa: fqcn[canonical]
        name: "{{ db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"

    - name: Create moodleuser with full read/write on the moodle database
      community.mysql.mysql_user:  # noqa: fqcn[canonical]
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        host: "{{ db_allowed_host }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"
      no_log: true

  handlers:
    - name: Restart mysqld
      ansible.builtin.service:
        name: mysqld
        state: restarted

# ---------------------------------------------------------------------------
# WEB SERVER
# ---------------------------------------------------------------------------
- name: Install httpd, PHP 8.3 and Moodle 5.3
  hosts: web
  become: true

  vars:
    php_packages_amazon:
      - php8.3
      - php8.3-cli
      - php8.3-common
      - php8.3-fpm
      - php8.3-mysqlnd
      - php8.3-pdo
      - php8.3-gd
      - php8.3-intl
      - php8.3-mbstring
      - php8.3-xml
      - php8.3-zip
      - php8.3-soap
      - php8.3-sodium
      - php8.3-bcmath
      - php8.3-opcache
      - php8.3-process
      - php8.3-ldap
    php_packages_el9:        # from the php:8.3 AppStream module
      - php
      - php-cli
      - php-common
      - php-fpm
      - php-mysqlnd
      - php-pdo
      - php-gd
      - php-intl
      - php-mbstring
      - php-xml
      - php-pecl-zip
      - php-soap
      - php-sodium
      - php-bcmath
      - php-opcache
      - php-process
      - php-ldap

  tasks:
    - name: Switch the PHP module stream to 8.3 (RHEL 9)
      ansible.builtin.shell: |
        set -o pipefail
        if dnf -q module list --enabled php 2>/dev/null | grep -Eq '^php +8\.3'; then exit 0; fi
        dnf -y module reset php && dnf -y module enable php:8.3 && echo changed
      args:
        executable: /bin/bash
      register: php_module
      changed_when: "'changed' in php_module.stdout"
      when: is_el9

    - name: Install httpd, PHP 8.3 (php-fpm), extensions and tools
      ansible.builtin.dnf:
        name: "{{ ['httpd', 'git', 'unzip', 'cronie'] + (php_packages_amazon if is_amazon else php_packages_el9) }}"
        state: present

    - name: Assert PHP is 8.3
      ansible.builtin.command: php -r 'echo PHP_VERSION;'
      register: php_version
      changed_when: false
      failed_when: not php_version.stdout.startswith('8.3')

    - name: Moodle PHP settings (shared by php-fpm and CLI)
      ansible.builtin.copy:
        dest: /etc/php.d/99-moodle.ini
        mode: "0644"
        content: |
          max_input_vars = 5000
          memory_limit = 512M
          upload_max_filesize = 200M
          post_max_size = 200M
          max_execution_time = 300
          opcache.enable = 1
          opcache.memory_consumption = 256
          opcache.max_accelerated_files = 20000
      notify: Restart php-fpm

    - name: Verify required PHP extensions are loaded
      ansible.builtin.shell: |
        set -o pipefail
        missing=""
        for ext in iconv mbstring curl openssl ctype zip zlib gd simplexml spl pcre dom xml xmlreader intl json hash fileinfo sodium mysqli; do
          php -m | grep -qix "$ext" || missing="$missing $ext"
        done
        [ -z "$missing" ] || { echo "Missing:$missing"; exit 1; }
      args:
        executable: /bin/bash
      changed_when: false

    - name: Mark Moodle directory as a safe git directory (repo is owned by apache)
      ansible.builtin.blockinfile:
        path: /etc/gitconfig
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED - moodle safe.directory"
        block: |
          [safe]
              directory = {{ moodle_dir }}

    - name: Clone Moodle 5.3 into /var/www/html/moodle
      ansible.builtin.git:
        repo: "{{ moodle_repo }}"
        dest: "{{ moodle_dir }}"
        version: "{{ moodle_branch }}"
        depth: 1
        update: false          # don't pull new commits on re-runs; upgrade deliberately
      register: moodle_clone

    - name: Set ownership of Moodle code
      ansible.builtin.file:
        path: "{{ moodle_dir }}"
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        recurse: true
      when: moodle_clone.changed  # noqa: no-handler

    - name: Create moodledata directory
      ansible.builtin.file:
        path: "{{ moodle_data }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        mode: "0770"

    - name: Write Moodle config.php (project root, outside /public)
      ansible.builtin.copy:
        dest: "{{ moodle_dir }}/config.php"
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        mode: "0640"
        content: |
          <?php
          unset($CFG);
          global $CFG;
          $CFG = new stdClass();

          $CFG->dbtype    = 'mysqli';
          $CFG->dblibrary = 'native';
          $CFG->dbhost    = '{{ mysql_private_ip }}';
          $CFG->dbname    = '{{ db_name }}';
          $CFG->dbuser    = '{{ db_user }}';
          $CFG->dbpass    = '{{ db_password }}';
          $CFG->prefix    = 'mdl_';
          $CFG->dboptions = [
              'dbpersist'   => 0,
              'dbport'      => 3306,
              'dbsocket'    => '',
              'dbcollation' => 'utf8mb4_unicode_ci',
          ];

          $CFG->wwwroot   = '{{ moodle_url }}';
          $CFG->dataroot  = '{{ moodle_data }}';
          $CFG->admin     = 'admin';
          $CFG->directorypermissions = 02777;

          // httpd FallbackResource /r.php is configured, so clean router URLs work.
          $CFG->routerconfigured = true;

          require_once(__DIR__ . '/lib/setup.php');

    # --- SELinux (RHEL 9 enforces it by default) -----------------------------
    - name: SELinux - let httpd/php-fpm write to moodledata
      ansible.builtin.shell: |
        set -o pipefail
        semanage fcontext -l | grep -q '^{{ moodle_data }}(/.\*)?' && exit 0
        semanage fcontext -a -t httpd_sys_rw_content_t '{{ moodle_data }}(/.*)?' && echo changed
      args:
        executable: /bin/bash
      register: se_data
      changed_when: "'changed' in se_data.stdout"
      when: selinux_on

    - name: SELinux - apply labels to Moodle code and moodledata
      ansible.builtin.command: restorecon -R {{ moodle_dir }} {{ moodle_data }}
      register: se_restore
      changed_when: se_restore.stdout | length > 0
      when: selinux_on

    - name: SELinux - allow httpd to reach the remote DB and the network
      ansible.builtin.shell: |
        set -o pipefail
        changed=""
        for b in httpd_can_network_connect_db httpd_can_network_connect; do
          getsebool "$b" | grep -q ' on$' || { setsebool -P "$b" on; changed=yes; }
        done
        [ -n "$changed" ] && echo changed || true
      args:
        executable: /bin/bash
      register: se_bool
      changed_when: "'changed' in se_bool.stdout"
      when: selinux_on

    - name: Apache (httpd) virtual host (Moodle 5.1+ serves from /public)
      ansible.builtin.copy:
        dest: /etc/httpd/conf.d/moodle.conf
        mode: "0644"
        content: |
          <VirtualHost *:80>
              ServerName {{ moodle_domain }}
              ServerAlias {{ web_public_ip }}
              DocumentRoot {{ moodle_dir }}/public

              <Directory {{ moodle_dir }}/public>
                  Options -Indexes +FollowSymLinks
                  AllowOverride All
                  Require all granted
                  DirectoryIndex index.php
                  FallbackResource /r.php
              </Directory>

              AcceptPathInfo On
              ErrorLog /var/log/httpd/moodle_error.log
              CustomLog /var/log/httpd/moodle_access.log combined
          </VirtualHost>
      notify: Restart httpd

    - name: Validate httpd config
      ansible.builtin.command: apachectl configtest
      changed_when: false

    - name: Start and enable php-fpm, httpd and crond
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [php-fpm, httpd, crond]

    - name: Open HTTP in firewalld
      ansible.builtin.shell: |
        firewall-cmd --query-service=http --permanent >/dev/null && exit 0
        firewall-cmd --add-service=http --permanent && firewall-cmd --reload && echo changed
      args:
        executable: /bin/bash
      register: fw_web
      changed_when: "'changed' in fw_web.stdout"
      when: firewalld_on

    - name: Apply httpd/PHP changes now
      ansible.builtin.meta: flush_handlers

    - name: Check the DB server is reachable on its private IP
      ansible.builtin.wait_for:
        host: "{{ mysql_private_ip }}"
        port: 3306
        timeout: 30
        msg: "Cannot reach MySQL at {{ mysql_private_ip }}:3306 - check the DB Security Group allows 3306 from the web server"

    - name: Check whether Moodle is already installed
      ansible.builtin.command: runuser -u {{ web_user }} -- php {{ moodle_dir }}/admin/cli/cfg.php --name=release
      register: moodle_installed
      changed_when: false
      failed_when: false
      when: moodle_auto_install | bool

    - name: Install Moodle database (CLI, first run only)
      ansible.builtin.command: >
        runuser -u {{ web_user }} --
        php {{ moodle_dir }}/admin/cli/install_database.php
        --agree-license
        --fullname="{{ moodle_site_fullname }}"
        --shortname="{{ moodle_site_shortname }}"
        --adminuser="{{ moodle_admin_user }}"
        --adminpass="{{ moodle_admin_pass }}"
        --adminemail="{{ moodle_admin_email }}"
      register: moodle_install
      changed_when: moodle_install.rc == 0
      when:
        - moodle_auto_install | bool
        - moodle_installed.rc != 0 or moodle_installed.stdout | length == 0
      no_log: true

    - name: Moodle cron every minute
      ansible.builtin.cron:
        name: moodle-cron
        user: "{{ web_user }}"
        job: "/usr/bin/php {{ moodle_dir }}/admin/cli/cron.php > /dev/null 2>&1"

    - name: Smoke test the site over HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        headers:
          Host: "{{ moodle_domain }}"
        status_code: [200, 303]
        follow_redirects: none
      changed_when: false

  handlers:
    - name: Restart php-fpm
      ansible.builtin.service:
        name: php-fpm
        state: restarted

    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
