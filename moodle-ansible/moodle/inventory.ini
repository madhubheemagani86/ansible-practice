# Single RHEL 9 server (Redhat-9-DevOps-Practice AMI)
# running nginx + PHP 8.3 + MySQL 8.4 + Moodle 5.0
# Replace SERVER_PUBLIC_IP with the instance's public IP.
[moodle]
moodleserver ansible_host=SERVER_PUBLIC_IP

[moodle:vars]
ansible_user=ec2-user
ansible_password=DevOps321
ansible_become_password=DevOps321
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no'
